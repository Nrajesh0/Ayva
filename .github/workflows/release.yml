name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/build.gradle.kts'
      # Source/test repairs must retry an unpublished version after failed CI.
      - 'app/src/**'
      - 'app/schemas/**'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/native-validation.yml'
      - 'tools/verify_native_data_safety.sh'
      - 'app/proguard-rules.pro'
      - '.github/workflows/release.yml'
      - 'tools/release_intent.py'
      - 'tools/package_release_apks.py'
  release:
    types: [published]   # Automatically triggers for any release published on GitHub Web UI
  workflow_dispatch:    # Enables manual trigger button in GitHub Actions

permissions:
  contents: read

jobs:
  native_checks:
    uses: ./.github/workflows/native-validation.yml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      publish: ${{ steps.publication.outputs.publish }}
      tag_name: ${{ steps.version_info.outputs.tag_name }}
      version_name: ${{ steps.version_info.outputs.version_name }}
      version_code: ${{ steps.version_info.outputs.version_code }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version Info
        id: version_info
        run: |
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed 's/.*versionName = "\(.*\)".*/\1/' | tr -d '[:space:]')
          VERSION_CODE=$(grep 'versionCode = ' app/build.gradle.kts | head -n 1 | tr -dc '0-9')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION_NAME" >> $GITHUB_ENV
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Extracted App Version: v$VERSION_NAME (versionCode: $VERSION_CODE)"

      - name: Check publication intent
        id: publication
        env:
          AYVA_BEFORE_SHA: ${{ github.event.before }}
        run: python3 tools/release_intent.py

      - name: Check assistant boundaries
        run: |
          python3 tools/check_chat_boundary.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Decode Keystore File
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 --decode > keystore.jks
          else
            echo "SIGNING_KEY secret is not set."
          fi

      - name: Check source security contracts
        run: python3 docs/security/ayva_review_checks.py
      - name: Run Android lint
        run: ./gradlew :app:lintDebug :app:lintRelease --no-daemon --stacktrace --max-workers=1
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --max-workers=1

      - name: Summarize unit test results
        if: always()
        run: python3 tools/summarize_unit_tests.py

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ github.sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-*
          if-no-files-found: ignore
          retention-days: 14

      - name: Build and Sign Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace --max-workers=1

      - name: Validate and prepare single universal APK
        run: python3 tools/package_release_apks.py

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-by-rj-v${{ env.VERSION_NAME }}-apk
          path: build/release-apks/
          retention-days: 14

  publish:
    if: needs.build.outputs.publish == 'true'
    needs: [build, native_checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: focus-by-rj-v${{ needs.build.outputs.version_name }}-apk
          path: build/release-apks

      - name: Check downloaded APK checksum
        working-directory: build/release-apks
        run: sha256sum --check SHA256SUMS.txt

      - name: Automatically Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || needs.build.outputs.tag_name }}
          name: ${{ github.event_name == 'release' && github.event.release.name || format('Release v{0} (Build {1})', needs.build.outputs.version_name, needs.build.outputs.version_code) }}
          files: |
            build/release-apks/*.apk
            build/release-apks/SHA256SUMS.txt
            build/release-apks/README.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

