name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/build.gradle.kts'
      # Source/test repairs must retry an unpublished version after failed CI.
      - 'app/src/**'
      - 'app/schemas/**'
      - 'gradle.properties'
      - 'app/proguard-rules.pro'
      - '.github/workflows/release.yml'
      - 'tools/release_intent.py'
  release:
    types: [published]   # Automatically triggers for any release published on GitHub Web UI
  workflow_dispatch:    # Enables manual trigger button in GitHub Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version Info
        id: version_info
        run: |
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed 's/.*versionName = "\(.*\)".*/\1/' | tr -d '[:space:]')
          VERSION_CODE=$(grep 'versionCode = ' app/build.gradle.kts | head -n 1 | tr -dc '0-9')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION_NAME" >> $GITHUB_ENV
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Extracted App Version: v$VERSION_NAME (versionCode: $VERSION_CODE)"

      - name: Check publication intent
        id: publication
        env:
          AYVA_BEFORE_SHA: ${{ github.event.before }}
        run: python3 tools/release_intent.py

      - name: Check assistant boundaries and dictionary data
        run: |
          python3 tools/check_chat_boundary.py
          python3 tools/check_dictionary.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Decode Keystore File
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 --decode > keystore.jks
          else
            echo "SIGNING_KEY secret is not set."
          fi

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --max-workers=2

      - name: Summarize unit test results
        if: always()
        run: python3 tools/summarize_unit_tests.py

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ github.sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build and Sign Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace --max-workers=2

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-by-rj-v${{ env.VERSION_NAME }}-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Automatically Create / Update GitHub Release
        if: steps.publication.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || env.TAG_NAME }}
          name: ${{ github.event_name == 'release' && github.event.release.name || format('Release v{0} (Build {1})', env.VERSION_NAME, env.VERSION_CODE) }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

